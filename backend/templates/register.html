<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Living Lab UNIMINUTO</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-brain"></i>
                </div>
                <h1 class="login-title">Crear Cuenta</h1>
                <p class="login-subtitle">Únete al Ecosistema de Aprendizaje</p>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="first_name" class="form-label">Nombre</label>
                    <input 
                        type="text" 
                        id="first_name" 
                        name="first_name" 
                        class="form-input" 
                        placeholder="Tu nombre"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="last_name" class="form-label">Apellido</label>
                    <input 
                        type="text" 
                        id="last_name" 
                        name="last_name" 
                        class="form-input" 
                        placeholder="Tu apellido"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="tu@correo.com"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Tu contraseña"
                        required
                        minlength="6"
                    >
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 16px;" data-original-text="Crear Cuenta">
                    <i class="fas fa-user-plus"></i>
                    Crear Cuenta
                </button>
            </form>
            
            <div class="text-center">
                <p class="text-muted">
                    ¿Ya tienes una cuenta? 
                    <a href="/login" style="color: var(--primary-purple); text-decoration: none;">
                        Inicia sesión aquí
                    </a>
                </p>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="/static/js/main.js"></script>
</body>
</html>
