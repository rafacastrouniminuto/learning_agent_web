<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas - Learning Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: none;
        }
        .header {
            background: white;
            color: #333;
            text-align: center;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .alert {
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-list me-3"></i>Mis Reservas</h1>
            <p>Gestiona y revisa tus reservas del Living Lab UNIMINUTO</p>
            <a href="/reservations" class="btn btn-outline-primary">
                <i class="fas fa-arrow-left me-2"></i>Volver al Sistema de Reservas
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <h4><i class="fas fa-calendar me-2"></i>Tus Reservas</h4>
                <div id="myReservationsList">
                    <div class="text-center py-4">
                        <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                        <p>Cargando mis reservas...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === JAVASCRIPT LIMPIO ===
        console.log('🚀 INICIO DEL SCRIPT');

        let currentUser = null;

        // Función para obtener usuario
        async function getCurrentUser() {
            console.log('📡 Obteniendo usuario...');
            try {
                const token = localStorage.getItem('access_token');
                console.log('🔑 Token encontrado:', token ? 'Sí' : 'No');
                
                if (!token) {
                    throw new Error('No hay token de acceso');
                }
                
                const response = await fetch('/auth/me', { 
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    currentUser = await response.json();
                    console.log('✅ Usuario:', currentUser.email);
                    return currentUser;
                } else {
                    const errorText = await response.text();
                    console.error('❌ Error en respuesta:', errorText);
                    throw new Error('No autenticado');
                }
            } catch (error) {
                console.error('❌ Error usuario:', error);
                // Solo mostrar alert si es un error crítico, no para redirección normal
                if (!error.message.includes('No hay token')) {
                    console.log('Redirigiendo al login...');
                }
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1000);
                throw error;
            }
        }

        // Función para cargar reservas
        async function loadReservations() {
            console.log('📊 Cargando reservas...');
            const container = document.getElementById('myReservationsList');
            
            container.innerHTML = '<div class="alert alert-info">Cargando...</div>';
            
            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    throw new Error('No hay token de acceso');
                }
                
                const response = await fetch('/api/reservations/me', { 
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                console.log('📨 Respuesta:', response.status);
                
                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(`Error ${response.status}: ${error}`);
                }
                
                const reservations = await response.json();
                console.log('📋 Reservas:', reservations);
                
                if (reservations.length === 0) {
                    container.innerHTML = `
                        <div class="alert alert-warning">
                            <h5>Sin reservas</h5>
                            <p>No tienes reservas registradas.</p>
                            <a href="/reservations" class="btn btn-primary">Crear Reserva</a>
                        </div>
                    `;
                } else {
                    let html = '<div class="row">';
                    reservations.forEach((res, i) => {
                        // Formatear herramientas si es array
                        const herramientas = Array.isArray(res.herramientas) 
                            ? res.herramientas.join(', ') 
                            : res.herramientas || 'N/A';
                        
                        // Formatear fecha SIN problema de zona horaria
                        const fechaFormateada = res.fecha_inicio 
                            ? (() => {
                                // Crear fecha directamente desde string sin conversión UTC
                                const fechaParts = res.fecha_inicio.split('T')[0].split('-');
                                const fecha = new Date(fechaParts[0], fechaParts[1] - 1, fechaParts[2]);
                                return fecha.toLocaleDateString('es-ES', {
                                    weekday: 'long',
                                    year: 'numeric',
                                    month: 'long',
                                    day: 'numeric'
                                });
                            })()
                            : 'N/A';
                        
                        // Formatear fecha de creación SIN problema de zona horaria
                        const fechaCreacion = res.created_at
                            ? (() => {
                                const fechaParts = res.created_at.split('T')[0].split('-');
                                const fecha = new Date(fechaParts[0], fechaParts[1] - 1, fechaParts[2]);
                                return fecha.toLocaleDateString('es-ES');
                            })()
                            : 'N/A';
                        
                        html += `
                            <div class="col-lg-6 mb-4">
                                <div class="card h-100">
                                    <div class="card-header bg-primary text-white">
                                        <h5 class="mb-0">
                                            <i class="fas fa-calendar-check me-2"></i>
                                            Reserva #${res.id || (i + 1)}
                                        </h5>
                                    </div>
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <strong><i class="fas fa-map-marker-alt me-2 text-primary"></i>Escenario:</strong>
                                                <br><span class="badge bg-info">${res.escenario || 'N/A'}</span>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <strong><i class="fas fa-users me-2 text-success"></i>Participantes:</strong>
                                                <br><span class="badge bg-success">${res.participantes || 'N/A'}</span>
                                            </div>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <strong><i class="fas fa-calendar me-2 text-warning"></i>Fecha de Reserva:</strong>
                                            <br><span class="text-muted">${fechaFormateada}</span>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <strong><i class="fas fa-tools me-2 text-secondary"></i>Herramientas:</strong>
                                            <br><small class="text-muted">${herramientas}</small>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <strong><i class="fas fa-bullseye me-2 text-info"></i>Objetivo:</strong>
                                            <br><small class="text-muted">${res.notas || 'N/A'}</small>
                                        </div>
                                        
                                        <div class="row">
                                            <div class="col-md-6">
                                                <strong><i class="fas fa-info-circle me-2 text-primary"></i>Estado:</strong>
                                                <br><span class="badge bg-${res.estado === 'activa' ? 'success' : res.estado === 'cancelled' ? 'danger' : 'warning'}">${res.estado || 'activa'}</span>
                                            </div>
                                            <div class="col-md-6">
                                                <strong><i class="fas fa-clock me-2 text-muted"></i>Creada:</strong>
                                                <br><small class="text-muted">${fechaCreacion}</small>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="card-footer bg-light">
                                        <div class="btn-group w-100" role="group">
                                            <button class="btn btn-outline-primary btn-sm" onclick="verDetalles('${res.id}')">
                                                <i class="fas fa-eye me-1"></i>Ver Detalles
                                            </button>
                                            <button class="btn btn-outline-secondary btn-sm" onclick="editarReserva('${res.id}')">
                                                <i class="fas fa-edit me-1"></i>Editar
                                            </button>
                                            <button class="btn btn-outline-danger btn-sm" onclick="cancelarReserva('${res.id}')">
                                                <i class="fas fa-times me-1"></i>Cancelar
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    container.innerHTML = html;
                }
                
            } catch (error) {
                console.error('💥 Error:', error);
                container.innerHTML = `
                    <div class="alert alert-danger">
                        <h5>Error</h5>
                        <p>${error.message}</p>
                        <button onclick="loadReservations()" class="btn btn-primary">Reintentar</button>
                    </div>
                `;
            }
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 DOM Cargado');
            
            getCurrentUser()
                .then(() => loadReservations())
                .catch(err => {
                    console.error('🚨 Error inicial:', err);
                });
        });

        // Funciones para los botones de acción
        function verDetalles(reservaId) {
            alert(`Ver detalles de reserva #${reservaId}\n\n(Función en desarrollo)`);
        }

        function editarReserva(reservaId) {
            alert(`Editar reserva #${reservaId}\n\n(Función en desarrollo)`);
        }

        function cancelarReserva(reservaId) {
            if (confirm(`¿Estás seguro de que quieres cancelar la reserva #${reservaId}?\n\nEsta acción no se puede deshacer.`)) {
                console.log(`🗑️ Cancelando reserva #${reservaId}...`);
                
                // Mostrar loading
                const container = document.getElementById('myReservationsList');
                const originalContent = container.innerHTML;
                
                // Agregar spinner de carga temporal
                const loadingOverlay = document.createElement('div');
                loadingOverlay.style.cssText = `
                    position: absolute; 
                    top: 0; 
                    left: 0; 
                    right: 0; 
                    bottom: 0; 
                    background: rgba(255,255,255,0.8); 
                    display: flex; 
                    align-items: center; 
                    justify-content: center;
                    z-index: 1000;
                `;
                loadingOverlay.innerHTML = '<div><i class="fas fa-spinner fa-spin fa-2x text-primary"></i><br><small>Cancelando reserva...</small></div>';
                container.style.position = 'relative';
                container.appendChild(loadingOverlay);
                
                // Realizar petición DELETE
                const token = localStorage.getItem('access_token');
                fetch(`/api/reservations/${reservaId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => {
                    console.log(`📡 Respuesta cancelación:`, response.status);
                    
                    if (response.ok) {
                        return response.json();
                    } else {
                        throw new Error(`Error ${response.status}: No se pudo cancelar la reserva`);
                    }
                })
                .then(data => {
                    console.log(`✅ Reserva cancelada exitosamente:`, data);
                    alert(`🎉 Reserva #${reservaId} cancelada exitosamente`);
                    
                    // Remover loading y recargar reservas
                    container.removeChild(loadingOverlay);
                    loadReservations(); // Recargar la lista
                })
                .catch(error => {
                    console.error(`❌ Error cancelando reserva:`, error);
                    alert(`❌ Error: ${error.message}`);
                    
                    // Remover loading
                    if (container.contains(loadingOverlay)) {
                        container.removeChild(loadingOverlay);
                    }
                });
            }
        }
    </script>
</body>
</html>
