# Docker Compose para Learning Agent Web - Living Lab UNIMINUTO
version: '3.8'

services:
  # Aplicación principal
  learning-agent:
    build: .
    container_name: learning-agent-web
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=living-lab-secret-key-change-in-production-2025
      - DATABASE_URL=sqlite:///./learning_agent.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-3.5-turbo
      - OPENAI_MAX_TOKENS=1000
      - MCP_SERVER_NAME=learning-agent-mcp
      - MCP_SERVER_VERSION=1.0.0
      - CORS_ORIGINS=["http://localhost:3000", "http://localhost:8000"]
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    volumes:
      # Persistir base de datos
      - ./data:/app/data
      # Persistir logs
      - ./logs:/app/logs
      # Desarrollo: montar código para hot-reload
      - ./backend:/app
    networks:
      - learning-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/mcp/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis (opcional para caché y sesiones futuras)
  redis:
    image: redis:7-alpine
    container_name: learning-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - learning-agent-network
    restart: unless-stopped
    command: redis-server --appendonly yes

networks:
  learning-agent-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
